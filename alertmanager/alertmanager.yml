# Copy to alertmanager.yml and fill in slack_api_url, or run without the
# alerting profile (prometheus still records alerts as pending/firing).
# Usage: docker compose --profile alerting up -d
global:
  resolve_timeout: 5m
route:
  receiver: slack
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
receivers:
  - name: slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/REPLACE/ME"
        channel: "#rosetta-alerts"
        title: "{{ .GroupLabels.alertname }} ({{ .Status }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}\n{{ end }}"
